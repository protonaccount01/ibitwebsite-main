<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নোটিশ বোর্ড - ইনস্টিটিউট অফ টেকনোলজি</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-900 text-white py-4 px-6 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">নোটিশ বোর্ড</h1>
            <a href="index.html" class="text-sm bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded transition">← হোমপেজ</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div id="notice-list" class="divide-y divide-slate-100">
                <p class="p-6 text-center text-slate-500">নোটিশ লোড হচ্ছে...</p>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center py-4 text-sm mt-auto">
        <p>© ২০২৬ ইনস্টিটিউট অফ টেকনোলজি</p>
    </footer>

    <script>
        async function fetchNotices() {
            const listEl = document.getElementById('notice-list');
            try {
                const res = await fetch('/api/get-notices');
                const notices = await res.json();

                if (notices.length === 0) {
                    listEl.innerHTML = '<p class="p-6 text-center text-slate-500">বর্তমানে কোনো প্রকাশ্য নোটিশ নেই।</p>';
                    return;
                }

                listEl.innerHTML = notices.map(n => `
                    <div class="p-6 hover:bg-slate-50 transition flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="space-y-1">
                            <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">
                                ${new Date(n.created_at).toLocaleDateString('bn-BD')}
                            </span>
                            <h3 class="text-lg font-bold text-slate-800 pt-1">${n.title}</h3>
                            ${n.description ? `<p class="text-slate-600 text-sm">${n.description}</p>` : ''}
                        </div>
                        ${n.pdf_url ? `
                            <a href="${n.pdf_url}" target="_blank" class="inline-flex items-center justify-center bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 font-medium px-4 py-2 rounded-lg text-sm transition shrink-0">
                                📄 PDF দেখুন / ডাউনলোড
                            </a>
                        ` : ''}
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = '<p class="p-6 text-center text-red-500">নোটিশ লোড করতে সমস্যা হয়েছে।</p>';
            }
        }
        fetchNotices();
    </script>
</body>
</html>
