<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBIT - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .ql-toolbar button:hover::after, .ql-toolbar .ql-picker:hover::after {
            content: attr(title); position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            background: #111827; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10; pointer-events: none;
        }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col" onclick="closeAllDropdowns()">

    <header class="bg-[#1a0b5e] text-white py-4 px-6 shadow-md z-20 flex justify-between items-center hidden" id="top-header">
        <div class="flex items-center gap-4">
            <button type="button" onclick="toggleSidebar()" class="text-white hover:text-blue-300 focus:outline-none p-1">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <img src="/assets/logo.jpeg" class="w-10 h-10 rounded-full border-2 border-white shadow-sm" alt="IBIT Logo" onerror="this.src='https://via.placeholder.com/40'">
            <div>
                <h1 class="text-xl font-black uppercase tracking-wider hidden sm:block">IBIT-ISLAMI BANK INSTITUTE OF TECHNOLOGY, SYLHET</h1>
                <p class="text-xs text-blue-200">Admin Control Panel</p>
            </div>
        </div>
    </header>

    <div id="login-screen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center relative">
            <img src="/assets/logo.jpeg" class="w-24 h-24 mx-auto rounded-full mb-4 border-4 border-slate-100 shadow-sm" alt="Logo" onerror="this.src='https://via.placeholder.com/100'">
            <h2 class="text-2xl font-black text-[#1a0b5e] mb-6 uppercase">Admin Login</h2>
            
            <input type="text" id="username" placeholder="Username" class="w-full px-4 py-3 border border-slate-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-[#1a0b5e]">
            
            <div class="relative mb-6">
                <input type="password" id="password" placeholder="Password" class="w-full px-4 py-3 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-[#1a0b5e]">
                <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-[#1a0b5e] focus:outline-none">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <button type="button" onclick="login()" id="login-btn" class="w-full bg-[#1a0b5e] text-white py-3 rounded font-bold hover:bg-blue-900 transition shadow-lg">LOGIN</button>
            <p id="login-error" class="text-red-500 mt-3 font-bold hidden">Invalid ID or Password</p>
        </div>
    </div>

    <div class="flex flex-grow overflow-hidden relative">
        <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10 justify-between transition-all duration-300 absolute md:relative h-full -translate-x-full md:translate-x-0" id="sidebar">
            <nav class="p-4 space-y-2 mt-4">
                <button type="button" onclick="showDashboard()" id="nav-dash" class="w-full text-left px-4 py-3 rounded text-sm font-bold bg-blue-700 text-white transition shadow">Dashboard</button>
                <button type="button" onclick="showNoticePanel()" id="nav-notice" class="w-full text-left px-4 py-3 hover:bg-slate-800 rounded text-sm font-bold text-slate-300 transition">Notice Board</button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button type="button" onclick="logout()" class="w-full flex justify-center items-center gap-2 text-red-400 font-bold hover:text-red-300 hover:bg-slate-800 py-3 rounded transition">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Logout
                </button>
            </div>
        </aside>

        <main class="flex-grow p-4 sm:p-8 overflow-y-auto hidden bg-slate-50 w-full" id="main-content">
            
            <div id="dashboard-view">
                <div class="bg-white p-10 rounded-xl shadow-sm border border-slate-200 text-center mt-10">
                    <h2 class="text-3xl font-black text-[#1a0b5e] mb-2 uppercase">Welcome to IBIT Admin Panel</h2>
                    <p class="text-slate-500">Select an option from the sidebar to manage website content.</p>
                </div>
            </div>

            <div id="notice-panel-view" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-slate-800">Notice Management</h1>
                    <button type="button" onclick="showEditor()" class="bg-[#1a0b5e] hover:bg-blue-900 text-white px-5 py-2.5 rounded font-bold transition shadow text-sm flex items-center gap-2">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Create Notice
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 pb-20 overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-sm uppercase border-b border-slate-200">
                                <th class="p-4 font-bold">Notice Title</th>
                                <th class="p-4 font-bold w-40">Status/Timer</th>
                                <th class="p-4 font-bold w-16 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-notices" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <div id="notice-editor-view" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-8 max-w-5xl mx-auto">
                <div class="mb-6 border-b border-slate-100 pb-4">
                    <h2 id="editor-title" class="text-2xl font-black text-[#1a0b5e] uppercase">Create Notice</h2>
                </div>

                <input type="hidden" id="edit-id">
                
                <label class="font-bold text-slate-700 text-sm mb-1 block">Notice Title</label>
                <input type="text" id="n-title" class="w-full px-4 py-3 border border-slate-300 rounded mb-6 text-lg font-bold focus:border-[#1a0b5e] focus:outline-none" placeholder="Enter title...">
                
                <div class="flex justify-between items-end mb-
