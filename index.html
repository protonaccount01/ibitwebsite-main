<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - IBIT Sylhet</title>
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="w-full flex-grow py-12 bg-white">
        <!-- অ্যানিমেশন ক্লাস (data-aos) যোগ করা হয়েছে -->
        <div data-aos="fade-up" data-aos-duration="1000">
            <h1 class="text-center text-3xl font-bold mt-10">Welcome to IBIT Sylhet</h1>
            <p class="text-center mt-4 text-slate-600">Top Ranked Private Polytechnic Institute in Bangladesh</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Animation JS & Fetch Script -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50 }); // Once: true means animation happens only once per scroll

        fetch('/header.html').then(response => response.text()).then(data => {
            document.getElementById('header-placeholder').innerHTML = data;
            const mobileBtn = document.getElementById('mobile-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if(mobileBtn) mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
        });
        fetch('/footer.html').then(response => response.text()).then(data => {
            document.getElementById('footer-placeholder').innerHTML = data;
        });
    </script>
</body>
</html>
