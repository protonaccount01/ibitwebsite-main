<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন প্যানেল - নোটিশ ম্যানেজমেন্ট</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border border-slate-200">
        <div class="flex justify-between items-center mb-6 border-b pb-3">
            <h2 class="text-xl font-bold text-slate-800">নতুন নোটিশ যোগ করুন</h2>
            <a href="notice.html" target="_blank" class="text-xs text-indigo-600 underline">লাইভ বোর্ড দেখুন</a>
        </div>
        
        <form id="notice-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">শিরোনাম *</label>
                <input type="text" id="title" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">বিবরণ (ঐচ্ছিক)</label>
                <textarea id="description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">পিডিএফ ফাইল (ঐচ্ছিক)</label>
                <input type="file" id="pdf-file" accept="application/pdf" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-md transition shadow">
                পাবলিশ করুন
            </button>
        </form>

        <div id="status-msg" class="mt-4 text-center font-medium text-sm"></div>
    </div>

    <script>
        const form = document.getElementById('notice-form');
        const statusMsg = document.getElementById('status-msg');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = "আপলোড হচ্ছে...";
            statusMsg.innerText = "";

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            
            const pdfFile = document.getElementById('pdf-file').files[0];
            if (pdfFile) {
                formData.append('pdf', pdfFile);
            }

            try {
                const response = await fetch('/api/add-notice', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusMsg.innerText = "✓ নোটিশ সফলভাবে পোস্ট হয়েছে!";
                    statusMsg.className = "mt-4 text-center text-green-600 font-bold";
                    form.reset();
                } else {
                    throw new Error();
                }
            } catch (error) {
                statusMsg.innerText = "✕ সমস্যা হয়েছে! আবার চেষ্টা করুন।";
                statusMsg.className = "mt-4 text-center text-red-600 font-bold";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "পাবলিশ করুন";
            }
        });
    </script>
</body>
</html>
